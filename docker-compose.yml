name: docker-project

services:

#app,build,context,dockerfile is not required if you have already built the image
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: expenseTracker-image
    container_name: expenseTracker-container
    ports:
      - "8000:8000"
    environment:
      DB_HOST: host.docker.internal
    env_file:
      - .env
    volumes:
      - .:/app

