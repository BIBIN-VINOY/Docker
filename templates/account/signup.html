{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>Signup</title>

    <link rel="stylesheet"
          href="{% static 'css/auth.css' %}">

</head>
<body>

<div class="auth-container">

    <div class="auth-card">

        <h2>Create Account</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p>
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
